<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>HexWars</title>
    <link rel="icon" type="image/svg+xml" href="hexwars-mark.svg">
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #10171b; }
      /* Full-window canvas: Unity keeps the WebGL render target matched to this CSS size × devicePixelRatio
         (matchWebGLToCanvasSize is on by default), so it's sharp at any window size and in fullscreen. */
      #unity-canvas { display: block; width: 100vw; height: 100vh; }
      #unity-loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%);
                       font-family: sans-serif; color: #e7eae3; text-align: center; }
      #unity-loading img { display: block; width: 80px; height: 80px; margin: 0 auto 22px; }
      #bar { width: 220px; height: 6px; margin: 10px auto 0; background: #26353d; border-radius: 3px; overflow: hidden; }
      #bar > div { width: 0%; height: 100%; background: #96dfc9; transition: width 0.1s; }
    </style>
      <meta property="og:title" content="HexWars &mdash; hex-grid tactics" />
    <meta property="og:description" content="Design your army from raw points. Outbuild, outthink, dominate." />
    <meta property="og:image" content="https://hwbootstrap.onrender.com/preview.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="HexWars &mdash; hex-grid tactics" />
    <meta name="twitter:description" content="Design your army from raw points. Outbuild, outthink, dominate." />
    <meta name="twitter:image" content="https://hwbootstrap.onrender.com/preview.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#10171B" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/hexwars-mark.svg" />
</head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading"><img src="hexwars-mark.svg" alt="HexWars H-in-hex logo">Loading HexWars…<div id="bar"><div id="fill"></div></div></div>
    <script>
      var canvas = document.querySelector("#unity-canvas");
      var config = {
        dataUrl: "Build/WebGL.data.unityweb?v=c3d53aea",
        frameworkUrl: "Build/WebGL.framework.js.unityweb?v=c3d53aea",
        codeUrl: "Build/WebGL.wasm.unityweb?v=c3d53aea",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "DefaultCompany",
        productName: "HexWars",
        productVersion: "0.1.0",
      };
      var script = document.createElement("script");
      script.src = "Build/WebGL.loader.js?v=c3d53aea";
      script.onload = () => {
        createUnityInstance(canvas, config, (p) => {
          document.querySelector("#fill").style.width = (100 * p) + "%";
        }).then((unityInstance) => {
          document.querySelector("#unity-loading").style.display = "none";
          // Board double-clicks confirm gameplay actions. Fullscreen remains available via the browser.
        }).catch((message) => { document.querySelector("#unity-loading").textContent = message; });
      };
      document.body.appendChild(script);
    </script>
  </body>
</html>
