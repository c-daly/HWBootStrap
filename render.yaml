# =============================================================================
# HexWars Steam Playtest - Render Blueprint
# =============================================================================
#
# What this file provisions:
#   - hexwars-match             production match server (Docker, this repo)
#   - hexwars-match-staging     the same image off the integration branch
#   - hexwars-match-db          production Render Postgres (private only)
#   - hexwars-match-staging-db  staging Render Postgres (private only)
#
# APPLYING THIS BLUEPRINT CREATES PAID RESOURCES. Two web services and two
# Postgres instances bill from the moment they exist, whether or not anybody is
# playing. It is not applied without the owner saying so, and the plan lines
# below are the ones to read first.
#
# ONE INSTANCE, DELIBERATELY. numInstances is 1 on both services and must stay
# there. A match lives in the memory of the process hosting it, and a second
# instance would take handshakes for matches it is not holding. Horizontal
# scaling is gated on sticky routing by match id; until that exists, scale up.
#
# SECRETS ARE NEVER IN THIS FILE. Every value marked sync:false is typed into
# the Render Dashboard once per service after the first apply, and every value
# marked OWNER-INPUT needs a decision before it. MATCH_METRICS_TOKEN is
# generated by Render and read back from the Dashboard when it is needed.
#
# Schema: https://render.com/docs/blueprint-spec
# Runbook: docs/operations/render-steam-playtest-runbook.md
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # Production match server
  # ---------------------------------------------------------------------------
  - type: web
    name: hexwars-match
    runtime: docker
    # OWNER-INPUT: pick the Playtest region. It cannot be changed after creation,
    # and the database must be created in the same region to stay on the private
    # network. One of: oregon, ohio, virginia, frankfurt, singapore.
    region: oregon
    # 0.5 CPU / 512 MB, the smallest paid plan (formerly named starter). Sized for
    # a Playtest, not for a launch; read the runbook before raising it.
    plan: 0.5c-512mb
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Exactly one. See the header.
    numInstances: 1
    # Readiness, not liveness: Render takes an instance out of rotation when this
    # fails, which is what should happen while the database is unreachable or the
    # startup recovery pass has not finished.
    healthCheckPath: /health/ready
    # Manual deploys only. A match server that redeployed on every commit would
    # drop every live game to do it; production is deployed by hand after staging.
    autoDeployTrigger: "off"
    # Longer than the 25 s the process gives itself to drain, so Render never
    # SIGKILLs a host that is still finishing a commit and saying goodbye.
    maxShutdownDelaySeconds: 60
    envVars:
      # Render translates the environment variables of a Docker service into build
      # arguments, which is how this reaches ARG INCLUDE_WEBGL in the Dockerfile.
      # The match service never serves the browser client, so it ships without it.
      - key: INCLUDE_WEBGL
        value: "false"
      # The image is immutable; see the comment in the Dockerfile. Repeated here so
      # the setting survives a Dashboard-side image change.
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: LOBBY_PROVIDER
        value: Steam
      - key: MATCH_PROTOCOL_VERSION
        value: "2"
      # Render terminates TLS and proxies to this process, so the client address
      # and the scheme arrive in forwarded headers and nothing else is true.
      - key: MATCH_TRUST_FORWARDED_HEADERS
        value: "true"
      # Render publishes no proxy address ranges, so there is no CIDR list to put in
      # MATCH_TRUSTED_PROXY_CIDRS and the trust has to be unconditional. That is
      # safe here and ONLY here: the instance has no public address of its own and
      # is reachable only through the Render router, so the router is the only peer
      # that can set X-Forwarded-For. On a host reachable directly this would let
      # every caller choose its own rate-limit partition with a header.
      - key: MATCH_TRUST_ALL_PROXIES
        value: "true"
      # MATCH_BUILD_ID is deliberately absent. The server falls back to
      # RENDER_GIT_COMMIT, which Render sets on every deploy, so the build id is
      # always the commit that is actually running. Set it explicitly only to pin a
      # build for a client compatibility window.
      - key: MATCH_METRICS_TOKEN
        generateValue: true
      # A stable secret, so a Steam id written to a log by one instance reads as the
      # same handle after a redeploy. Generated rather than entered by hand.
      - key: MATCH_LOG_PSEUDONYM_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hexwars-match-db
          property: connectionString
      # Entered once in the Dashboard after the first apply. Never in this file.
      - key: STEAM_APP_ID
        sync: false
      - key: STEAM_PUBLISHER_WEB_API_KEY
        sync: false
      # https:// plus the custom domain. It must be the domain clients actually
      # reach: the websocket URL handed to every client is derived from it.
      - key: MATCH_PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_WEB_ORIGINS
        sync: false
      - key: MATCH_COMPATIBLE_CLIENT_BUILDS
        sync: false

  # ---------------------------------------------------------------------------
  # Staging match server - the same image, its own secrets, its own database
  # ---------------------------------------------------------------------------
  - type: web
    name: hexwars-match-staging
    runtime: docker
    # The same region as production, so a staging restore of a production backup
    # behaves the way production does. OWNER-INPUT if the production region moves.
    region: oregon
    plan: 0.5c-512mb
    # Staging tracks the integration branch until Steam cutover, so every group
    # branch that merges is exercised end to end before it reaches main.
    # OWNER-INPUT: change to main once cutover is done.
    branch: steam-hosting/integration
    dockerfilePath: ./Dockerfile
    dockerContext: .
    numInstances: 1
    healthCheckPath: /health/ready
    autoDeployTrigger: "off"
    maxShutdownDelaySeconds: 60
    envVars:
      - key: INCLUDE_WEBGL
        value: "false"
      - key: DOTNET_HOSTBUILDER__RELOADCONFIGONCHANGE
        value: "false"
      # Production, not Development. Staging exists to find out what production
      # will do, and Development relaxes the very transport rules that matter most.
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: LOBBY_PROVIDER
        value: Steam
      - key: MATCH_PROTOCOL_VERSION
        value: "2"
      - key: MATCH_TRUST_FORWARDED_HEADERS
        value: "true"
      # Same reasoning as production: reachable only through the Render router.
      - key: MATCH_TRUST_ALL_PROXIES
        value: "true"
      - key: MATCH_METRICS_TOKEN
        generateValue: true
      - key: MATCH_LOG_PSEUDONYM_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: hexwars-match-staging-db
          property: connectionString
      # Its own values, never the production ones. A staging service holding the
      # production publisher key is a production secret kept in a second place.
      - key: STEAM_APP_ID
        sync: false
      - key: STEAM_PUBLISHER_WEB_API_KEY
        sync: false
      - key: MATCH_PUBLIC_BASE_URL
        sync: false
      - key: ALLOWED_WEB_ORIGINS
        sync: false
      - key: MATCH_COMPATIBLE_CLIENT_BUILDS
        sync: false

databases:
  # ---------------------------------------------------------------------------
  # Production Postgres. Private only: an empty ipAllowList means nothing on the
  # public internet can open a connection at all, and the match service reaches it
  # over the private network the shared region provides.
  # ---------------------------------------------------------------------------
  - name: hexwars-match-db
    databaseName: hexwars
    # OWNER-INPUT: 0.1c-256mb is the smallest PAID plan (formerly basic-256mb) at
    # 0.1 CPU / 256 MB / 100 connections. It is enough for a Playtest on one
    # instance, whose pool is 20 connections. Move to 0.5c-1g (formerly basic-1gb)
    # before opening the Playtest wider; changing the plan costs brief downtime.
    plan: 0.1c-256mb
    region: oregon
    # Pinned rather than defaulted. The schema and the tests are written against
    # 16, and this value cannot be changed after creation.
    postgresMajorVersion: "16"
    ipAllowList: []

  # ---------------------------------------------------------------------------
  # Staging Postgres. The same shape, so restoring a production backup into
  # staging is a like-for-like rehearsal rather than an approximation of one.
  # ---------------------------------------------------------------------------
  - name: hexwars-match-staging-db
    databaseName: hexwars
    plan: 0.1c-256mb
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []
